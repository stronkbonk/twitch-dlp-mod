name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      # One platform failing shouldn't hide the result of the others
      fail-fast: false
      matrix:
        # Windows is what this is mostly used on, so it can't be the platform
        # that is never checked
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.22.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # The lockfile is committed, so install exactly what it pins
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run test:types

      - name: Test
        run: pnpm test

      - name: Build the bundle
        run: pnpm run build

      # The bundle is committed, so it must never fall behind the sources
      - name: Check that the committed bundle is up to date
        run: git diff --exit-code twitch-dlp.js

      - name: Run the bundle
        run: |
          node twitch-dlp.js --version
          node twitch-dlp.js --help
