name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The lockfile is committed, so install exactly what it pins
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run test:types

      - name: Test
        run: pnpm test

      - name: Build the bundle
        run: pnpm run build

      # The bundle is committed, so it must never fall behind the sources
      - name: Check that the committed bundle is up to date
        run: git diff --exit-code twitch-dlp.js

      - name: Run the bundle
        run: |
          node twitch-dlp.js --version
          node twitch-dlp.js --help > /dev/null
